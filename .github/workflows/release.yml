name: Release

on:
  push:
    branches: [main]

# Parallel runs race to push the release commit and tag; queue them instead.
# Never cancel a run mid-release: it can leave a tag without a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run starts after earlier runs pushed release commits;
          # releasing from the triggering SHA would be rejected as non-fast-forward.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --legacy-peer-deps

      - run: npm run test:coverage

      - uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        # With nothing releasable since the last tag, release-it logs "No new version to release" and exits 0
        run: npm run release -- --ci
